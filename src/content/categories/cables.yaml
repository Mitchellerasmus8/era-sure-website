summary: 'Source solar PV, armoured, battery and AC cables for South African electrical and renewable projects, in custom lengths with nationwide delivery.'
intro: 'Era-Sure supplies the full range of AC and DC cabling across all Ranges (LV, MV and HV), sizes and specifications. Cables can be cut to length, drummed and/or rolled to the site requirement.'
sourceItems:
  - 'Photovoltaic cables (1500-2000V DC)'
  - 'CU armoured SWA and ECC cables (600/1000V - 6.6/11kV)'
  - 'ALU Armoured SWA and ECC cables (600/1000V - 1.9/3.3kV)'
  - 'Unarmoured flexible power cables (600/1000V - 33.kV AC/DC)'
  - 'Aerial bundle cables (ABC)'
  - 'Polybraid cables (1.5kV - 13.8kV DC)'
  - 'Domestic cables (General purpose wires, surfix, cabtyres etc.)'
  - 'Battery cables (Silicone insulated, PermoPower etc.)'
  - 'All cable accessories (joint/term kits, lugs/ferrules, heat shrinks, pvc/metal glands)'
